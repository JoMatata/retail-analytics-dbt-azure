version: 2

sources:
  - name: raw
    description: >
      Raw landing zone. Locally (DuckDB) each table is read straight from data/raw/*.csv with every
      column typed as text, exactly as files land in Azure Blob / ADLS Gen2. On Azure the same
      tables live in the `raw` schema of Azure SQL / Synapse (loaded via COPY INTO or ADF), and
      `external_location` is ignored.
    schema: raw
    meta:
      external_location: "read_csv('{{ env_var('RAW_DATA_DIR', 'data/raw') }}/{name}.csv', header = true, all_varchar = true)"
    tables:
      - name: customers
        description: CRM customer extract. Contains re-synced duplicates (latest `updated_at` wins).
        columns:
          - name: customer_id
            description: Natural key from the CRM.
            tests: [not_null]
      - name: products
        description: Product master. `list_price` is sometimes text like "KES 1,250.00".
        columns:
          - name: product_id
            tests: [not_null, unique]
      - name: orders
        description: Order headers from web, app and POS. Contains duplicate loads.
        columns:
          - name: order_id
            tests: [not_null]
      - name: order_items
        description: Order lines. Contains zero-quantity lines and duplicate loads.
      - name: payments
        description: Payment events (M-Pesa STK push, card, cash). Contains callback replays.
      - name: marketing_spend
        description: Monthly paid-media spend by acquisition channel and campaign type.
